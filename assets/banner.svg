<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0a0f1d 100%); border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(20px, -10px); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 240px; }
    .float-p1 { animation: floatParticle 5s ease-in-out infinite; }
    .float-p2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .float-p3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .pulse-line { stroke-dasharray: 6 6; animation: waveDash 3s linear infinite; }
  </style>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#38bdf8" filter="url(#softGlow)" opacity="0.3"/>
  <circle class="orb-2" cx="980" cy="220" r="160" fill="#a855f7" filter="url(#softGlow)" opacity="0.3"/>

  <!-- Background Animated Network Flows -->
  <g opacity="0.4">
    <path class="pulse-line" d="M 50 280 C 300 280, 450 310, 600 280 S 900 250, 1150 280" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="pulse-line" d="M 100 60 C 350 40, 500 70, 750 40 S 950 60, 1100 40" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Floating Particles in Background -->
  <circle class="float-p1" cx="160" cy="70" r="3.5" fill="#38bdf8" />
  <circle class="float-p2" cx="880" cy="80" r="4" fill="#818cf8" />
  <circle class="float-p3" cx="1060" cy="180" r="3" fill="#c084fc" />
  <circle class="float-p1" cx="340" cy="290" r="2.5" fill="#06b6d4" />
  <circle class="float-p2" cx="720" cy="295" r="3" fill="#ec4899" />

  <!-- Main Content (Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Badges / Pill Tags Top -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="138" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="69" y="17" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">⚡ TEST LIFECYCLE</text>

      <rect x="148" y="0" width="144" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="220" y="17" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">🎥 SESSION REPLAY</text>

      <rect x="302" y="0" width="170" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="387" y="17" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">🛡️ STATE MANAGEMENT</text>
    </g>

    <!-- Title in Foreground -->
    <text x="0" y="135" fill="#f8fafc" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Test Session Lifecycle
    </text>
    <text x="0" y="180" fill="url(#glowGrad)" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; State Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="222" fill="#94a3b8" font-size="16" font-weight="400">
      Curated directory of SaaS &amp; Open-Source platforms for remote test execution, privileged session recording,
    </text>
    <text x="0" y="246" fill="#94a3b8" font-size="16" font-weight="400">
      terminal auditable state capture, browser grid orchestration, and access state control.
    </text>

    <!-- Tech Stack Pill Highlights -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#10b981"/>
      <text x="28" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">SaaS Cloud Grids</text>

      <!-- Pill 2 -->
      <rect x="168" y="0" width="168" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="184" cy="16" r="4.5" fill="#3b82f6"/>
      <text x="196" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">PAM &amp; Bastion Hosts</text>

      <!-- Pill 3 -->
      <rect x="348" y="0" width="170" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="364" cy="16" r="4.5" fill="#8b5cf6"/>
      <text x="376" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">Terminal Recorders</text>

      <!-- Pill 4 -->
      <rect x="530" y="0" width="180" height="32" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <circle cx="546" cy="16" r="4.5" fill="#ec4899"/>
      <text x="558" y="21" fill="#e2e8f0" font-size="12.5" font-weight="600">AI Agent Audit &amp; MCP</text>
    </g>
  </g>

  <!-- Decorative Corner Icon Box (Right side) -->
  <g transform="translate(1010, 70)" opacity="0.9">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="60" cy="60" r="38" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 4" class="pulse-line"/>
    <polygon points="52,44 76,60 52,76" fill="url(#glowGrad)"/>
    <!-- Status lights -->
    <circle cx="25" cy="25" r="4" fill="#ef4444"/>
    <circle cx="38" cy="25" r="4" fill="#eab308"/>
    <circle cx="51" cy="25" r="4" fill="#22c55e"/>
  </g>
</svg>
